- hosts: all
  become: true
  tasks:
    - name: Install docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Install docker-compose
      apt:
        name: docker-compose-v2
        state: present

    - name: Ensure docker is running
      command: docker info
      register: docker_info
      ignore_errors: true
      
    - name: Start docker daemon if not running
      shell: dockerd > /var/log/docker.log 2>&1 &
      when: docker_info.rc != 0
      become: true

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reset ssh connection to allow user changes to affect ansible user
      meta: reset_connection

    - name: Create deployment directory
      file:
        path: /opt/lightllm
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy docker-compose.yml to remote
      copy:
        src: docker-compose.yml
        dest: /opt/lightllm/docker-compose.yml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy LiteLLM configuration to remote
      copy:
        src: litellm-config.yaml
        dest: /opt/lightllm/litellm-config.yaml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Check if .env file exists locally
      local_action:
        module: stat
        path: "{{ playbook_dir }}/.env"
      register: env_file_stat
      become: false

    - name: Copy .env file to remote if it exists
      copy:
        src: .env
        dest: /opt/lightllm/.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when: env_file_stat.stat.exists

    - name: Create .env from template if .env doesn't exist
      copy:
        src: env.example
        dest: /opt/lightllm/.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when: not env_file_stat.stat.exists

    - name: Warn about API key configuration
      debug:
        msg: "⚠️  Remember to update /opt/lightllm/.env with your actual OPENROUTER_API_KEY"
      when: not env_file_stat.stat.exists

    - name: Stop existing docker-compose services
      community.docker.docker_compose_v2:
        project_src: /opt/lightllm
        state: absent
      ignore_errors: true

    - name: Pull latest images (docker compose pull)
      command: docker compose pull --quiet
      args:
        chdir: /opt/lightllm
      become: true
      become_user: "{{ ansible_user }}"

    - name: Start services (docker compose up -d)
      command: docker compose up -d --remove-orphans
      args:
        chdir: /opt/lightllm
      become: true
      become_user: "{{ ansible_user }}"

    - name: Ensure services are pulled and recreated (idempotent)
      community.docker.docker_compose_v2:
        project_src: /opt/lightllm
        pull: true
        remove_orphans: true
        recreate: always
        state: present

    - name: Show docker compose status
      command: docker compose -f /opt/lightllm/docker-compose.yml ps
      register: compose_ps
      changed_when: false

    - name: Print docker compose status
      debug:
        var: compose_ps.stdout_lines

    - name: Wait for LiteLLM health endpoint
      uri:
        url: http://localhost:8080/health
        method: GET
        return_content: false
        status_code: 200
        validate_certs: false
      register: healthcheck
      retries: 30
      delay: 2
      until: healthcheck.status == 200
      failed_when: false

    - name: Ensure litellm container is running
      command: docker ps --filter name=litellm --filter status=running --format {{'"'}}{{'{{'}}.Names{{'}}'}}{{'"'}}
      register: litellm_ps
      retries: 10
      delay: 2
      until: litellm_ps.stdout is search('litellm')
      changed_when: false

    - name: Show recent LiteLLM logs
      command: docker compose -f /opt/lightllm/docker-compose.yml logs --no-color --tail 120
      register: litellm_logs
      changed_when: false

    - name: Print LiteLLM logs
      debug:
        var: litellm_logs.stdout_lines
