services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "8080:4000"
    restart: unless-stopped
    environment:
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
