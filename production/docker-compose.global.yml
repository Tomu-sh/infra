services:
  # Ansible orchestrator that deploys to production server
  ansible-deploy:
    image: willhallonline/ansible:latest
    container_name: ansible-production-deploy
    volumes:
      - .:/ansible
      - ~/.ssh:/root/.ssh:ro
    working_dir: /ansible
    networks:
      - production-network
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
    command: >
      sh -c "
        echo '🔧 Preparing production deployment...' &&
        echo '📋 Checking configuration...' &&
        echo '🔑 Checking SSH keys...' &&
        ls -la /root/.ssh/ | head -10 &&
        echo '📄 Checking .env file...' &&
        if [ ! -f .env ]; then echo '❌ .env file not found. Copy from env.example and set your API key.'; exit 1; fi &&
        echo '✅ .env file found' &&
        if ! grep -q 'OPENROUTER_API_KEY=sk-or-v1-' .env; then echo '❌ Please set your OpenRouter API key in .env'; exit 1; fi &&
        echo '✅ API key found in .env' &&
        echo '🚀 Starting production deployment...' &&
        ansible-playbook -i inventory deploy.yml -v || (echo '❌ Ansible failed with exit code $?' && exit 1)
      "

networks:
  production-network:
    driver: bridge
