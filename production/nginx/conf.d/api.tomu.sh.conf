# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.tomu.sh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.tomu.sh;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/live/api.tomu.sh/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.tomu.sh/privkey.pem;

    # Basic SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;

    # CORS Headers for all origins (including localhost)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # LiteLLM API endpoint with /litellm prefix
    location /litellm/ {
        # Remove /litellm prefix when forwarding to backend
        rewrite ^/litellm/(.*) /$1 break;
        
        proxy_pass http://litellm:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://litellm:4000/health;
    }

    # Root endpoint
    location / {
        return 200 '{"status":"ok","message":"API available at /litellm/"}';
        add_header Content-Type application/json;
    }
}
