---
- hosts: production
  become: true
  vars:
    app_dir: /opt/litellm-production
    domain: api.tomu.sh
    
  tasks:
    # - name: Update system packages
    #   apt:
    #     update_cache: yes
    #     upgrade: dist
        
    - name: Install required packages
      apt:
        name:
          - docker.io
          - curl
        state: present

    - name: Install Docker Compose plugin
      shell: |
        curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group (if not already)
      shell: |
        if ! groups {{ ansible_user }} | grep -q docker; then
          usermod -aG docker {{ ansible_user }}
          echo "User added to docker group"
        else
          echo "User already in docker group"
        fi
      register: docker_group_result
      
    - name: Show docker group result
      debug:
        var: docker_group_result.stdout

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy production files
      copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      with_items:
        - docker-compose.yml
        - litellm-config.yaml
        - .env
        - Makefile

    - name: Copy nginx configuration directory
      copy:
        src: nginx/
        dest: "{{ app_dir }}/nginx/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy setup script
      copy:
        src: setup-ssl.sh
        dest: "{{ app_dir }}/setup-ssl.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create required directories
      file:
        path: "{{ app_dir }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      with_items:
        - nginx/ssl
        - certbot/www

    - name: Check if SSL certificate exists
      stat:
        path: "{{ app_dir }}/nginx/ssl/live/{{ domain }}/fullchain.pem"
      register: ssl_cert

    - name: Get SSL certificate if it doesn't exist
      shell: |
        cd {{ app_dir }}
        # Start temporary nginx for ACME challenge
        docker run -d --name nginx-temp -p 80:80 \
          -v {{ app_dir }}/certbot/www:/var/www/certbot:ro \
          nginx:alpine sh -c "
            echo 'server { 
              listen 80; 
              server_name {{ domain }}; 
              location /.well-known/acme-challenge/ { 
                root /var/www/certbot; 
              } 
              location / { 
                return 200 \"ACME challenge server\"; 
                add_header Content-Type text/plain;
              } 
            }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        
        # Wait for nginx to start
        sleep 5
        
        # Get SSL certificate
        docker run --rm \
          -v {{ app_dir }}/nginx/ssl:/etc/letsencrypt \
          -v {{ app_dir }}/certbot/www:/var/www/certbot \
          certbot/certbot certonly --webroot \
          --webroot-path=/var/www/certbot \
          --email admin@{{ domain }} \
          --agree-tos --no-eff-email \
          --force-renewal -d {{ domain }}
        
        # Stop temporary nginx
        docker stop nginx-temp || true
        docker rm nginx-temp || true
      become_user: "{{ ansible_user }}"
      when: not ssl_cert.stat.exists

    - name: Pull and start production services
      shell: |
        cd {{ app_dir }}
        echo "Pulling Docker images..."
        docker compose pull
        echo "Starting services..."
        docker compose up -d
        echo "Services started, checking status..."
        docker compose ps
      become_user: "{{ ansible_user }}"
      register: compose_result
      
    - name: Show compose output
      debug:
        var: compose_result.stdout_lines

    - name: Wait for services to be ready
      wait_for:
        port: 443
        delay: 10
        timeout: 60

    - name: Test health endpoint
      uri:
        url: "https://{{ domain }}/health"
        method: GET
        status_code: 200
        validate_certs: no
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Display deployment info
      debug:
        msg:
          - "🎉 Deployment complete!"
          - "API available at: https://{{ domain }}/litellm/"
          - "Health check: https://{{ domain }}/health"
          - "Test with: curl https://{{ domain }}/litellm/v1/models"

